name: Build and Release
on:
  push:
    tags:
      - '*'
jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install pipenv
        run: pip install pipenv
      - name: Install dependencies
        run: pipenv install --dev
      - name: Work around pipenv not actually installing packaging/setuptools
        # `pipenv install --dev` (and even `pipenv sync --dev`) resolves
        # packaging/setuptools into Pipfile.lock correctly but silently
        # leaves them out of the venv's site-packages, which breaks
        # PyInstaller (it imports packaging.requirements during its own
        # startup). A direct pip install into the same venv does put them
        # there. Reproduced independently of this project (same failure on
        # a from-scratch pyZoLoaner checkout with today's pipenv/PyInstaller),
        # so this isn't specific to our Pipfile.
        run: pipenv run pip install packaging setuptools
      - name: Build with PyInstaller
        # Built from ImgSnips.spec rather than equivalent CLI flags so the
        # macOS build picks up the spec's Info.plist customization
        # (CFBundleDocumentTypes, associating ImgSnips with PDFs in
        # Finder's "Open With" list) -- onedir, not onefile: PyInstaller
        # deprecates --onefile combined with --windowed .app bundles on
        # macOS (a .app can't be a single file) and will make it a hard
        # error in v7.0.
        run: pipenv run pyinstaller ImgSnips.spec
      - name: Remove redundant loose build
        # --windowed on macOS produces both a bare dist/ImgSnips/ onedir
        # folder and a .app bundle wrapping its own copy of the same contents.
        # Only the .app is meant to be distributed; drop the loose one so the
        # zip isn't doubled up.
        run: rm -rf dist/ImgSnips
      - name: Add Gatekeeper quarantine-removal helper
        # The app isn't signed with a paid Apple Developer ID, so Gatekeeper
        # flags it. Ship a one-click script to clear the quarantine flag
        # instead of making users run Terminal commands themselves.
        run: |
          cp "packaging/macos/Fix macOS Warning.command" dist/
          chmod +x "dist/Fix macOS Warning.command"

      - name: Zip artifact
        uses: thedoctor0/zip-release@0.7.6
        with:
          directory: dist
          filename: "ImgSnips-macos.zip"
          # -y: store symlinks as symlinks. Without it, plain `zip -r` (this
          # action's default) dereferences them, turning the .app bundle's
          # Contents/Resources/* symlinks into full duplicate copies of
          # Contents/Frameworks/*. That doubles the archive size and, worse,
          # corrupts the bundle layout Qt expects when resolving its own
          # paths at startup, causing a segfault in QLibraryInfo on launch.
          custom: "-y"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ImgSnips-macos
          path: dist/ImgSnips-macos.zip

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install pipenv
        run: pip install pipenv
      - name: Install dependencies
        run: pipenv install --dev
      - name: Work around pipenv not actually installing packaging/setuptools
        # `pipenv install --dev` (and even `pipenv sync --dev`) resolves
        # packaging/setuptools into Pipfile.lock correctly but silently
        # leaves them out of the venv's site-packages, which breaks
        # PyInstaller (it imports packaging.requirements during its own
        # startup). A direct pip install into the same venv does put them
        # there. Reproduced independently of this project (same failure on
        # a from-scratch pyZoLoaner checkout with today's pipenv/PyInstaller),
        # so this isn't specific to our Pipfile.
        run: pipenv run pip install packaging setuptools
      - name: Build with PyInstaller
        run: pipenv run pyinstaller --onefile --windowed --name ImgSnips --icon packaging/icon/imgsnips.ico --add-data "spinner.gif;." --add-data "imgsnips.png;." --add-data "fonts;fonts" --add-data "icons/flip-horizontal.svg;icons" --add-data "icons/flip-vertical.svg;icons" --add-data "icons/rotate-right.svg;icons" --add-data "icons/rotate-left.svg;icons" main.py

      - name: Zip artifact
        uses: thedoctor0/zip-release@0.7.6
        with:
          directory: dist
          filename: "ImgSnips-windows.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ImgSnips-windows
          path: dist/ImgSnips-windows.zip

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install pipenv
        run: pip install pipenv
      - name: Install dependencies
        run: pipenv install --dev
      - name: Work around pipenv not actually installing packaging/setuptools
        # `pipenv install --dev` (and even `pipenv sync --dev`) resolves
        # packaging/setuptools into Pipfile.lock correctly but silently
        # leaves them out of the venv's site-packages, which breaks
        # PyInstaller (it imports packaging.requirements during its own
        # startup). A direct pip install into the same venv does put them
        # there. Reproduced independently of this project (same failure on
        # a from-scratch pyZoLoaner checkout with today's pipenv/PyInstaller),
        # so this isn't specific to our Pipfile.
        run: pipenv run pip install packaging setuptools
      - name: Build with PyInstaller
        run: pipenv run pyinstaller --onefile --windowed --name ImgSnips --add-data "spinner.gif:." --add-data "imgsnips.png:." --add-data "fonts:fonts" --add-data "icons/flip-horizontal.svg:icons" --add-data "icons/flip-vertical.svg:icons" --add-data "icons/rotate-right.svg:icons" --add-data "icons/rotate-left.svg:icons" main.py

      - name: Zip artifact
        uses: thedoctor0/zip-release@0.7.6
        with:
          directory: dist
          filename: "ImgSnips-linux.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ImgSnips-linux
          path: dist/ImgSnips-linux.zip

  release:
    needs: [build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Get Changelog Entry
        id: changelog_reader
        uses: mindsers/changelog-reader-action@v2
        with:
          validation_level: warn

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      # Create a release for this specific version
      - name: Update Release with Files
        id: create_version_release
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          name: Release ${{ steps.changelog_reader.outputs.version }}
          draft: true
          artifacts: "dist/*.zip"
          tag: ${{ steps.changelog_reader.outputs.version }}
          body: ${{ steps.changelog_reader.outputs.changes }}
